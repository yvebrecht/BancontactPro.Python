name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Lint
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy src

      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Builds the distribution only; there is deliberately no publish or release step.
      - name: Build
        run: |
          python -m pip install build
          python -m build
