[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bancontactpro"
dynamic = ["version"]
description = "Unofficial Python client for the Bancontact Pro payment, refund and reconciliation APIs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff", "mypy"]

[tool.hatch.version]
path = "src/bancontactpro/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bancontactpro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]  # str+Enum is kept for Python 3.11 compatibility and wire-value equality

[tool.ruff.lint.per-file-ignores]
"src/bancontactpro/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
